<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<meta name="description" content="Reserva tu cita, mira tu tarjeta de fidelidad y acumula sellos en Club The Elegance Barbershop.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="96x96" href="/icons/favicon-96.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="The Elegance">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Club The Elegance Barbershop · Reserva tu cita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Pinyon+Script&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;--ink:#fff;--silver:#b9bdc4;--mute:#7c8087;--line:rgba(185,189,196,.22);--line-strong:rgba(185,189,196,.55);
  --cond:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --script:"Pinyon Script","Snell Roundhand","Brush Script MT",cursive;
  --body:"Barlow","Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--bg);color-scheme:dark;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:0 22px 150px}

/* Marca */
header{text-align:center;padding:56px 0 44px}
.club{font-family:var(--script);font-size:38px;line-height:1;color:var(--silver);margin:0 0 -6px;opacity:0;animation:rise .9s .1s cubic-bezier(.2,.7,.2,1) forwards}
.mark{font-family:var(--cond);font-weight:700;font-size:clamp(58px,17vw,92px);line-height:.9;letter-spacing:.01em;text-transform:uppercase;margin:0;opacity:0;animation:rise .9s .25s cubic-bezier(.2,.7,.2,1) forwards}
.barber{font-family:var(--cond);font-weight:500;font-size:19px;letter-spacing:.42em;text-transform:uppercase;color:var(--silver);margin:10px 0 0;padding-left:.42em;opacity:0;animation:rise .9s .4s cubic-bezier(.2,.7,.2,1) forwards}
.rule{width:56px;height:1px;background:var(--line-strong);margin:30px auto 18px;opacity:0;animation:rise .9s .5s forwards}
.lead{color:var(--mute);margin:0;font-size:15px;opacity:0;animation:rise .9s .55s forwards}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* Secciones */
section{padding:30px 0;border-top:1px solid var(--line)}
h2{font-family:var(--cond);font-weight:600;font-size:24px;letter-spacing:.04em;margin:0 0 18px;color:var(--ink)}
.svc .p .t{display:block;font-family:var(--body,inherit);font-weight:400;font-size:12px;color:var(--mute);text-align:right;letter-spacing:.02em;margin-top:2px}.svc[aria-pressed="true"] .p .t{color:#4a4d52}
.day:disabled{color:#4b4e53;border-style:dashed;cursor:not-allowed;opacity:.6}.day:disabled .num{text-decoration:line-through}.day .m.c{color:#e5a3a3;text-transform:none}
.dgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.dgrid .day{width:auto}.day.cl{border-color:#e5a3a3;color:#e5a3a3}.day.cl .num{text-decoration:line-through}.day.cl .w,.day.cl .m{color:#e5a3a3}
.st.new{animation:halo 1.2s ease-out 3}.st.new .sc,.st.new .stx{animation:pop .7s cubic-bezier(.2,.9,.3,1.4)}
.imp.bloq{border-color:#e5a3a3;border-left-color:#e5a3a3}
/* Destello en la tarjeta de fidelidad */
.tcard::after{content:"";position:absolute;top:-25%;bottom:-25%;left:-55%;width:42%;pointer-events:none;background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.10) 30%,rgba(255,255,255,.4) 50%,rgba(255,255,255,.10) 70%,transparent 100%);transform:skewX(-20deg);animation:shine 5.5s ease-in-out 1.2s infinite;mix-blend-mode:screen;filter:blur(1px)}
@keyframes shine{0%{transform:skewX(-20deg) translateX(0)}45%,100%{transform:skewX(-20deg) translateX(480%)}}
/* Vista previa del servicio con difuminado */
.svw{display:grid}
.svp{display:grid;grid-template-rows:0fr;transition:grid-template-rows .55s cubic-bezier(.3,.7,.2,1)}
.svp.open{grid-template-rows:1fr}
.svp>div{overflow:hidden;min-height:0;position:relative;border:1px solid var(--line);border-top:0;margin-top:-1px}
.svp img{display:block;width:100%;height:220px;object-fit:cover;filter:blur(16px);transform:scale(1.1);opacity:.4;transition:filter 1s ease,transform 1s ease,opacity .8s ease}
.svp.open img{filter:blur(0);transform:none;opacity:1}
.svp .fd{position:absolute;left:0;right:0;top:0;height:96px;pointer-events:none;background:linear-gradient(to bottom,rgba(255,255,255,.92),rgba(255,255,255,.35) 45%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);-webkit-mask-image:linear-gradient(to bottom,#000 20%,transparent);mask-image:linear-gradient(to bottom,#000 20%,transparent)}
.svp .fb{position:absolute;left:0;right:0;bottom:0;height:46px;pointer-events:none;background:linear-gradient(to top,rgba(0,0,0,.75),transparent)}
/* Galería */
.gsec{margin:0 0 34px}.gsec h2{margin-bottom:6px}.gsec .hint{margin:0 0 14px}
.grow{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 22px;margin:0 -22px;padding:2px 22px 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.grow::-webkit-scrollbar{display:none}
.gi{flex:0 0 72%;max-width:290px;scroll-snap-align:start;margin:0}
.gm{position:relative;aspect-ratio:4/5;background:#0b0b0c;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.gm img,.gm video,.gm iframe{width:100%;height:100%;object-fit:cover;border:0;display:block}
.gm img{cursor:zoom-in}
.gi figcaption{font-size:13px;color:var(--mute);margin-top:8px;line-height:1.4}
.lb{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.94);display:grid;place-items:center;padding:16px;animation:rise .3s;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;object-fit:contain}
.gsc{border:1px solid var(--line);padding:16px;display:grid;gap:14px;margin:0 0 18px}
.gadm{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.gth{flex:0 0 124px;display:grid;gap:6px;align-content:start}
.gth .tm{position:relative;aspect-ratio:1;background:#111;overflow:hidden;border:1px solid var(--line)}
.gth img,.gth video{width:100%;height:100%;object-fit:cover;display:block}
.gth input{font-size:13px;padding:8px}
.pl{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;color:#fff;text-shadow:0 0 8px #000;pointer-events:none}
.hint{color:var(--mute);font-size:14px;margin:-10px 0 16px}

/* Servicios */
.services{display:grid;gap:10px}
.svc{display:flex;justify-content:space-between;align-items:baseline;gap:16px;width:100%;text-align:left;background:transparent;color:var(--ink);border:1px solid var(--line);padding:16px 18px;font:inherit;cursor:pointer;border-radius:2px;transition:border-color .2s,background .2s,color .2s}
.svc .n{font-family:var(--cond);font-weight:600;font-size:22px;letter-spacing:.03em}
.svc .d{display:block;color:var(--mute);font-size:13px;margin-top:2px;transition:color .2s}
.svc .p{font-family:var(--cond);font-weight:600;font-size:22px;white-space:nowrap}
.svc:hover{border-color:var(--line-strong)}
.svc[aria-pressed="true"]{background:var(--ink);color:#000;border-color:var(--ink)}
.svc[aria-pressed="true"] .d{color:#4a4d52}

/* Días */
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;margin:0 -22px;padding-left:22px;padding-right:22px;scroll-snap-type:x proximity;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;width:68px;scroll-snap-align:start;background:transparent;color:var(--ink);border:1px solid var(--line);padding:12px 0;font:inherit;text-align:center;cursor:pointer;border-radius:2px;transition:border-color .2s,background .2s,color .2s}
.day .w{display:block;font-size:13px;color:var(--mute);text-transform:capitalize}
.day .num{display:block;font-family:var(--cond);font-weight:600;font-size:30px;line-height:1.1}
.day .m{display:block;font-size:12px;color:var(--mute);text-transform:capitalize}
.day:hover{border-color:var(--line-strong)}
.day[aria-pressed="true"]{background:var(--ink);color:#000;border-color:var(--ink)}
.day[aria-pressed="true"] .w,.day[aria-pressed="true"] .m{color:#4a4d52}

/* Horas */
.hours{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hour{background:transparent;color:var(--ink);border:1px solid var(--line);padding:13px 0;font-family:var(--cond);font-weight:500;font-size:20px;letter-spacing:.03em;cursor:pointer;border-radius:2px;transition:border-color .2s,background .2s,color .2s}
.hour:hover:not(:disabled){border-color:var(--line-strong)}
.hour[aria-pressed="true"]{background:var(--ink);color:#000;border-color:var(--ink)}
.hour:disabled{color:#4b4e53;border-style:dashed;cursor:not-allowed;text-decoration:line-through}
.empty{color:var(--mute);margin:0}

/* Campos */
.fields{display:grid;gap:22px}
label{display:block;font-size:14px;color:var(--silver);margin-bottom:6px}
input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line-strong);color:var(--ink);font:inherit;font-size:18px;padding:8px 0 10px;border-radius:0;outline:none;transition:border-color .2s}
input:focus{border-bottom-color:var(--ink)}
input[aria-invalid="true"]{border-bottom-color:#e5a3a3}

/* Barra de envío */
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(0,0,0,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:14px 22px calc(14px + env(safe-area-inset-bottom,0px))}
.bar-in{max-width:560px;margin:0 auto}
.sum{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px;min-height:24px}
.sum .t{color:var(--silver);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sum .tot{font-family:var(--cond);font-weight:700;font-size:26px;white-space:nowrap}
.send{width:100%;background:var(--ink);color:#000;border:0;padding:16px;font-family:var(--cond);font-weight:700;font-size:21px;letter-spacing:.08em;cursor:pointer;border-radius:2px;transition:background .2s,transform .1s}
.send:hover{background:var(--silver)}
.send:active{transform:scale(.99)}
.err{color:#e5a3a3;font-size:14px;margin:8px 0 0;min-height:0}
.err:empty{display:none}

.done{display:none;text-align:center;padding:40px 0}
.done.show{display:block;animation:rise .6s forwards}
.done .club{opacity:1;animation:none;font-size:34px}
.done p{color:var(--silver);margin:14px 0 0}
.done button{margin-top:26px;background:transparent;color:var(--ink);border:1px solid var(--line-strong);padding:12px 22px;font:inherit;cursor:pointer;border-radius:2px}

:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.club,.mark,.barber,.rule,.lead{opacity:1}}

[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.logo{display:block;width:min(300px,72%);height:auto;margin:0 auto;opacity:0;animation:rise .9s .1s cubic-bezier(.2,.7,.2,1) forwards}
/* Botón instalar app */
#instalar{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;display:none;align-items:center;gap:10px;background:#fff;color:#000;border:0;padding:13px 22px;font-family:var(--cond);font-weight:700;font-size:17px;letter-spacing:.08em;text-transform:uppercase;border-radius:40px;box-shadow:0 6px 26px rgba(0,0,0,.6);cursor:pointer}
#instalar.on{display:flex;animation:rise .5s cubic-bezier(.2,.7,.2,1)}
#instalar i{font-style:normal;opacity:.6;margin-left:4px;padding-left:12px;border-left:1px solid #0003}
.miembros{display:flex;align-items:center;justify-content:center;gap:14px;margin:12px auto 0;font-family:var(--cond);font-weight:600;font-size:20px;letter-spacing:.5em;padding-left:.5em;text-transform:uppercase;color:var(--ink);opacity:0;animation:rise .9s .3s cubic-bezier(.2,.7,.2,1) forwards}.miembros::before,.miembros::after{content:"";width:34px;height:1px;background:var(--line-strong)}
header{padding:44px 0 30px}
.rule{margin:24px auto 16px}
.nav{display:flex;justify-content:center;gap:34px;border-bottom:1px solid var(--line);margin:0 -22px 4px;padding:0 22px}
.nav a{font-family:var(--cond);font-weight:600;font-size:19px;letter-spacing:.06em;color:var(--mute);text-decoration:none;padding:12px 2px;border-bottom:1px solid transparent;margin-bottom:-1px;transition:color .2s,border-color .2s}
.nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
.btn{display:block;width:100%;background:var(--ink);color:#000;border:0;padding:15px;font-family:var(--cond);font-weight:700;font-size:20px;letter-spacing:.08em;cursor:pointer;border-radius:2px;transition:background .2s}
.btn:hover{background:var(--silver)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line-strong)}
.btn.ghost:hover{background:rgba(255,255,255,.06)}
.btn.sm{display:inline-block;width:auto;padding:7px 12px;font-size:16px;letter-spacing:.04em}
.link{color:var(--silver);background:none;border:0;font:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0}
.msg{border:1px solid var(--line-strong);padding:14px 16px;margin:0 0 20px;text-align:center;color:var(--ink)}
.msg.warn{border-color:#e5a3a3;color:#e5a3a3}
.card{border:1px solid var(--line-strong);padding:26px 20px;text-align:center}
.card .logo{width:150px;animation:none;opacity:1;margin-bottom:6px}
.card h3{font-family:var(--cond);font-weight:600;font-size:22px;letter-spacing:.06em;margin:10px 0 2px}
.card .who{color:var(--silver);margin:0 0 20px;font-size:15px}
.sellos{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.sello{aspect-ratio:1;border:1px dashed var(--line-strong);border-radius:50%;display:grid;place-items:center;color:var(--mute);font-family:var(--cond);font-size:18px;overflow:hidden}
.sello.on{border:1px solid var(--ink);background:rgba(255,255,255,.07)}
.sello.on img{width:78%;height:auto;animation:pop .45s cubic-bezier(.2,.9,.3,1.4)}
@keyframes pop{from{transform:scale(.3) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
.count{font-family:var(--cond);font-weight:600;font-size:34px;margin:22px 0 0;line-height:1}
.imp{border:1px solid var(--line-strong);border-left:3px solid var(--ink);padding:12px 14px;margin:18px 0 0;font-size:14px;line-height:1.55;color:var(--ink);text-align:left}.imp b{font-family:var(--cond);letter-spacing:.06em;font-size:15px}.imp.venc{border-color:#e5a3a3;border-left-color:#e5a3a3}.wab{margin-top:16px}.count small{font-size:16px;color:var(--mute);letter-spacing:.06em}
.premio{margin-top:18px;padding-top:18px;border-top:1px solid var(--line);color:var(--silver);font-size:15px}
.premio b{display:block;color:var(--ink);font-family:var(--cond);font-size:21px;letter-spacing:.03em;font-weight:600;margin-top:2px}
.premio img{max-width:100%;max-height:150px;margin:0 auto 10px;display:block;border-radius:2px}
.lista{display:grid;gap:8px;margin-top:14px}
.fila{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;border:1px solid var(--line);padding:12px 14px}
.fila .i{min-width:0}.fila .i b{display:block;font-weight:500}.fila .i span{color:var(--mute);font-size:13px}
.fila .a{display:flex;gap:6px;align-items:center}
.fila .a em{font-style:normal;font-family:var(--cond);font-weight:600;font-size:20px;min-width:52px;text-align:center}
.qrs{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.qr{text-align:center}.qr .box{background:#fff;padding:10px;display:inline-block;line-height:0}.qr p{margin:8px 0 0;font-size:14px;color:var(--silver)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
textarea,select{width:100%;background:transparent;border:1px solid var(--line-strong);color:var(--ink);font:inherit;padding:10px;border-radius:2px}
.note{color:var(--mute);font-size:13px;margin:10px 0 0}
.stack{display:grid;gap:18px}

a.btn{text-align:center;text-decoration:none}
.nav{gap:26px}
.hubs{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.hub{display:grid;gap:14px;justify-items:center;text-align:center}
.hub .btn{font-size:18px;padding:14px 8px;letter-spacing:.05em}
.qrw .box{background:#fff;padding:10px;line-height:0;display:inline-block}
.fnac{position:relative;display:grid;grid-template-columns:1fr 1.7fr 1.2fr;gap:8px}
.wheel{height:132px;overflow-y:auto;scroll-snap-type:y mandatory;padding:44px 0;scrollbar-width:none;text-align:center;border:1px solid var(--line);border-radius:2px;-webkit-mask-image:linear-gradient(#0000,#000 32%,#000 68%,#0000);mask-image:linear-gradient(#0000,#000 32%,#000 68%,#0000);overscroll-behavior:contain}
.wheel::-webkit-scrollbar{display:none}
.wi{height:44px;line-height:44px;scroll-snap-align:center;font-family:var(--cond);font-weight:500;font-size:22px;color:var(--mute);cursor:pointer;transition:color .15s}
.wheel:not(.pend) .wi.on{color:var(--ink);font-weight:700}
.fsel{position:absolute;left:0;right:0;top:44px;height:44px;border-top:1px solid var(--line-strong);border-bottom:1px solid var(--line-strong);pointer-events:none}

header{position:relative}
.back{position:absolute;left:-8px;top:8px;display:flex;align-items:center;gap:2px;min-height:44px;padding:0 10px 0 4px;background:none;border:0;color:var(--silver);font-family:var(--cond);font-weight:600;font-size:18px;letter-spacing:.06em;cursor:pointer;z-index:2;transition:color .2s}
.back:hover{color:var(--ink)}.back svg{width:22px;height:22px}
.cardsec{border-top:0;padding-top:26px}
.tw{container-type:inline-size;width:100%}
.tcard{position:relative;min-height:63.05cqw;gap:2.5cqw;display:flex;flex-direction:column;justify-content:space-between;padding:5.5cqw 5.5cqw 5cqw;border-radius:5cqw;border:1px solid rgba(185,189,196,.38);background:radial-gradient(120% 95% at 12% 0%,#1d1d20 0%,#0b0b0c 55%,#000 100%);box-shadow:0 22px 44px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.09),inset 0 0 0 1px rgba(0,0,0,.7);overflow:hidden}
.tcard::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.055) 50%,transparent 62%);pointer-events:none}
.tt{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--cond);font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:var(--silver);font-size:max(8px,2.4cqw)}
.tt b{font-weight:700;letter-spacing:.08em;font-size:max(12px,4cqw);color:var(--ink)}
.tg5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2.8cqw}
.tf{font-family:var(--script);font-size:max(15px,5.4cqw);line-height:1;color:var(--silver);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{min-width:0;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;position:relative;border:1px solid rgba(185,189,196,.2);background:rgba(255,255,255,.015);transition:box-shadow .5s,border-color .5s}
.st .lg{width:72%;height:auto;opacity:.17;transition:opacity .5s,filter .5s}
.st.on{border-color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.3),0 0 1.8cqw .2cqw rgba(255,255,255,.55),inset 0 0 1.5cqw rgba(255,255,255,.22)}
.st.on .lg{opacity:1;filter:drop-shadow(0 0 .6cqw rgba(255,255,255,.95)) brightness(1.2)}
.st.sp{border-color:rgba(185,189,196,.5)}
.st.sp .sc{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%;opacity:.92}
.stx{font-family:var(--cond);font-weight:600;text-transform:uppercase;letter-spacing:.04em;font-size:max(7px,2.15cqw);line-height:1.1;text-align:center;padding:0 10%;color:var(--ink);overflow-wrap:break-word}
.st.new{animation:halo 1.5s ease-out 2}
.st.new .lg{animation:pop .6s cubic-bezier(.2,.9,.3,1.4)}
/* Tarjeta: sellos más grandes y vistosos */
.tcard{padding:3.4cqw 3.2cqw 3.6cqw!important}
.tg5{gap:1.2cqw!important}

<script>
/* ===== Ajustes: edita aquí ===== */
const WHATSAPP = "51918032254";          // +51 918 032 254
const NEGOCIO  = "Club The Elegance Barbershop";
const SERVICIOS = [
  {n:"Corte clásico Elegance",       d:"", t:"30 min", p:25},
  {n:"Limpieza facial",              d:"", t:"30 min", p:20},
  {n:"Corte y barba Elegance",       d:"", t:"30 min", p:30}
];
const DIAS_DISPONIBLES = 14;             // cuántos días mostrar
const DIAS_CERRADO = [];                 // días cerrados (0 = domingo)
const HORA_INICIO = 12, HORA_FIN = 21.5; // abre 12:00, cierra 21:30 (última cita 21:00)
const DURACION = 30;                     // minutos por servicio
/* ================================= */

const $ = id => document.getElementById(id);
const S = {svc:null, day:null, hour:null};
const fmtSoles = n => "S/ " + n.toFixed(2).replace(/\.00$/,"");
const fmtHora = m => { const h = Math.floor(m/60), mm = String(m%60).padStart(2,"0"); const x = h % 12 || 12; return x + ":" + mm + " " + (h < 12 ? "a. m." : "p. m."); };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const fecha = (d, o) => d.toLocaleDateString("es-PE", o);

/* Servicios */
const escS = t => String(t == null ? "" : t).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function pintaServicios(){
  const b1 = $("services"), b2 = $("services2"); b1.innerHTML = ""; b2.innerHTML = ""; S.svc = null;
  const dos = SERVICIOS.some(s => s.g);   /* hay "Otros servicios": las dos pestañas son independientes */
  SERVICIOS.forEach((s,i)=>{
    const box = dos && s.g ? b2 : b1;
    const w = document.createElement("div"); w.className = "svw";
    const b = document.createElement("button");
    b.type="button"; b.className="svc"; b.dataset.i = i; b.setAttribute("aria-pressed","false");
    b.innerHTML = '<span><span class="n">'+escS(s.n)+'</span>'+(s.d ? '<span class="d">'+escS(s.d)+'</span>' : '')+'</span><span class="p">'+fmtSoles(s.p)+(s.t ? '<span class="t">'+escS(s.t)+'</span>' : '')+'</span>';
    w.appendChild(b);
    if(s.img){ const pv = document.createElement("div"); pv.className = "svp"; pv.innerHTML = '<div><img src="'+escS(s.img)+'" alt="'+escS(s.n)+'"><span class="fd"></span><span class="fb"></span></div>'; w.appendChild(pv); }
    b.onclick = ()=>{ S.svc = i; document.querySelectorAll("#svtrack .svc").forEach(c=>c.setAttribute("aria-pressed", +c.dataset.i===i)); document.querySelectorAll("#svtrack .svp").forEach(p=>p.classList.toggle("open", p.parentNode===w)); resumen(); };
    box.appendChild(w);
  });
  if (dos && !b1.children.length) b1.innerHTML = '<p class="hint" style="text-align:center;padding:18px 0;color:var(--mute)">Aún no hay servicios aquí. Desliza para ver otros servicios.</p>';
  pagerSvc(dos);
  resumen();
}
let svPg = 0, svRO = null;
function pagerSvc(dos){
  const tr = $("svtrack"), tabs = $("svtabs"), hint = $("svhint"), pages = [$("services"), $("services2")];
  tr.classList.toggle("one", !dos); tabs.hidden = !dos; hint.hidden = !dos; pages[1].hidden = !dos; tr.style.height = "";
  if (svRO) { svRO.disconnect(); svRO = null; }
  if (!dos) { svPg = 0; return; }
  const sync = () => { tr.style.height = pages[svPg].offsetHeight + "px"; };
  const mark = () => {
    tabs.querySelectorAll(".svtab").forEach((t,i)=>{ t.classList.toggle("on", i===svPg); t.setAttribute("aria-selected", i===svPg); });
    hint.innerHTML = svPg === 0 ? "<span>Desliza para ver otros servicios</span><i>›››</i>" : '<i class="l">‹‹‹</i><span>Desliza para volver a servicios</span>';
    sync();
  };
  tr.onscroll = () => { const p = Math.round(tr.scrollLeft / (tr.clientWidth || 1)); if (p !== svPg && (p === 0 || p === 1)) { svPg = p; mark(); } };
  tabs.querySelectorAll(".svtab").forEach((t,i)=>{ t.onclick = () => tr.scrollTo({ left: i * tr.clientWidth, behavior: "smooth" }); });
  if (window.ResizeObserver) { svRO = new ResizeObserver(sync); pages.forEach(p => svRO.observe(p)); }
  svPg = Math.round(tr.scrollLeft / (tr.clientWidth || 1)) || 0; mark();
}
pintaServicios();

/* Días */
const hoy = new Date(); hoy.setHours(0,0,0,0);
const lista = [];
for(let i=0; lista.length < DIAS_DISPONIBLES; i++){
  const d = new Date(hoy); d.setDate(hoy.getDate()+i);
  if(!DIAS_CERRADO.includes(d.getDay())) lista.push(d);
}
/* Días (los días sin atención los marca el administrador) */
const dKey = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const cerrado = d => (cfg.cerrados || []).includes(dKey(d));
function pintaDias(){
  const box = $("days"); box.innerHTML = "";
  if(S.day && cerrado(S.day)){ S.day = null; S.hour = null; horas(); resumen(); }
  lista.forEach((d,i)=>{
    const x = cerrado(d), b = document.createElement("button");
    b.type="button"; b.className="day"; b.disabled = x; b.setAttribute("aria-pressed", String(!!S.day && S.day.getTime()===d.getTime()));
    b.setAttribute("aria-label", cap(fecha(d,{weekday:"long",day:"numeric",month:"long"})) + (x ? " (sin atención)" : ""));
    b.innerHTML = '<span class="w">'+fecha(d,{weekday:"short"}).replace(".","")+'</span><span class="num">'+d.getDate()+'</span>' + (x ? '<span class="m c">Cerrado</span>' : '<span class="m">'+fecha(d,{month:"short"}).replace(".","")+'</span>');
    b.onclick = ()=>{ S.day = d; S.hour = null; [...$("days").children].forEach((c,j)=>c.setAttribute("aria-pressed", j===i)); horas(); resumen(); };
    $("days").appendChild(b);
  });
}

/* Horas */
function horas(){
  const box = $("hours"); box.innerHTML = "";
  if(!S.day){ box.innerHTML = '<p class="empty" style="grid-column:1/-1">Primero elige un día.</p>'; return; }
  const ahora = new Date();
  const esHoy = S.day.getTime() === hoy.getTime();
  let hay = false;
  for(let h=HORA_INICIO*60; h+DURACION<=HORA_FIN*60; h+=DURACION){
    const pasada = esHoy && h <= ahora.getHours()*60 + ahora.getMinutes();
    const b = document.createElement("button");
    b.type="button"; b.className="hour"; b.textContent = fmtHora(h);
    b.setAttribute("aria-pressed", S.hour===h); b.disabled = pasada;
    if(!pasada) hay = true;
    b.onclick = ()=>{ S.hour = h; [...box.children].forEach(c=>c.setAttribute("aria-pressed", c===b)); resumen(); };
    box.appendChild(b);
  }
  if(!hay) box.insertAdjacentHTML("beforeend",'<p class="empty" style="grid-column:1/-1">Ya no hay horas hoy. Elige otro día.</p>');
}
horas();

/* Resumen */
function resumen(){
  const partes = [];
  if(S.svc!==null) partes.push(SERVICIOS[S.svc].n);
  if(S.day) partes.push(cap(fecha(S.day,{weekday:"short",day:"numeric",month:"short"}).replace(/\./g,"")));
  if(S.hour!==null) partes.push(fmtHora(S.hour));
  $("sumText").textContent = partes.length ? partes.join(" · ") : "Elige servicio, día y hora";
  $("sumTot").textContent = S.svc!==null ? fmtSoles(SERVICIOS[S.svc].p) : "";
  $("err").textContent = "";
}

/* Envío */
const limpio = s => s.trim().replace(/\s+/g," ");
const mayus = s => s.toLowerCase().replace(/(^|\s)\S/g, c=>c.toUpperCase());
$("send").onclick = ()=>{
  const nombre = limpio($("nombre").value), okNom = nombre.split(" ").length >= 2;
  $("nombre").setAttribute("aria-invalid", !okNom);
  let falta = null;
  if(S.svc===null) falta = "Elige un servicio.";
  else if(!S.day) falta = "Elige un día.";
  else if(cerrado(S.day)) falta = "Ese día no hay atención. Elige otro día.";
  else if(S.hour===null) falta = "Elige una hora.";
  else if(!okNom) falta = "Escribe tu nombre y apellido.";
  if(falta){ $("err").textContent = falta; return; }

  const s = SERVICIOS[S.svc];
  const dia = cap(fecha(S.day,{weekday:"long",day:"numeric",month:"long",year:"numeric"}));
  const msg =
"*" + NEGOCIO + "*\n" +
"_Nueva reserva de cita_\n\n" +
"*Cliente:* " + mayus(nombre) + "\n" +
"*Servicio:* " + s.n + "\n" +
"*Día:* " + dia + "\n" +
"*Hora:* " + fmtHora(S.hour) + "\n" +
"*Total:* " + fmtSoles(s.p) + "\n\n" +
"Quedo atento a su confirmación. ¡Gracias!";
  window.open("https://wa.me/" + WHATSAPP + "?text=" + encodeURIComponent(msg), "_blank", "noopener");
  $("form").style.display = "none"; $("bar").style.display = "none"; $("done").classList.add("show");
  window.scrollTo({top:0});
};
$("again").onclick = ()=>{
  $("done").classList.remove("show"); $("form").style.display = ""; $("bar").style.display = "";
};
</script>

  return [bloq ? "¡Tu tarjeta se reactivó! Sello agregado. Gracias por volver." : "¡Sello agregado! Gracias por tu visita.", false, g ? { i: f.sellos, e } : null];
}
async function vistaVisita() {

/* ---------- Fecha de nacimiento (carrusel) y registro ---------- */
const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const nac = { d: 0, m: 0, y: 0 }, ITEM = 44;
const resumenNac = () => { $("nacTxt").textContent = nac.d && nac.m && nac.y ? nac.d + " de " + MESES[nac.m - 1].toLowerCase() + " de " + nac.y : "Desliza para elegir tu fecha"; };
function rueda(el, items, key, ini) {
  el.innerHTML = items.map(([v, t]) => '<div class="wi" data-val="' + v + '">' + t + "</div>").join("");
  el.classList.add("pend"); el.tabIndex = 0; let u = false, tm;
  const sel = i => { i = Math.max(0, Math.min(items.length - 1, i)); nac[key] = items[i][0]; el.classList.remove("pend"); [...el.children].forEach((c, j) => c.classList.toggle("on", j === i)); resumenNac(); };
  ["touchstart", "mousedown", "wheel", "keydown"].forEach(ev => el.addEventListener(ev, () => { u = true; }, { passive: true }));
  el.addEventListener("scroll", () => { if (!u) return; clearTimeout(tm); tm = setTimeout(() => { sel(Math.round(el.scrollTop / ITEM)); u = false; }, 110); });
  el.onclick = e => { const c = e.target.closest(".wi"); if (!c) return; const i = [...el.children].indexOf(c); el.scrollTo({ top: i * ITEM, behavior: "smooth" }); sel(i); };
  el.scrollTop = ini * ITEM;
}
function initNac() {
  nac.d = nac.m = nac.y = 0; const Y = new Date().getFullYear(), ys = []; for (let y = Y; y >= Y - 90; y--) ys.push([y, y]);
  rueda($("wd"), Array.from({ length: 31 }, (_, i) => [i + 1, i + 1]), "d", 14);
  rueda($("wm"), MESES.map((t, i) => [i + 1, t]), "m", 5);
  rueda($("wy"), ys, "y", Y - 1995); resumenNac();
}
$("regBtn").onclick = async () => {
  const e = $("regErr"), partes = limpio($("rn").value).split(" "), t = normTel($("rt").value), m = $("rc").value.trim();
  if (partes.length < 2) return e.textContent = "Escribe tu primer nombre y apellido.";
  if (!t) return e.textContent = "Escribe un número de WhatsApp válido (9 dígitos).";
  if (!/^\S+@\S+\.\S+$/.test(m)) return e.textContent = "Escribe un correo válido.";
  if (!(nac.d && nac.m && nac.y)) return e.textContent = "Elige tu fecha de nacimiento.";
  if (new Date(nac.y, nac.m - 1, nac.d).getMonth() !== nac.m - 1) return e.textContent = "La fecha de nacimiento no es válida.";
  const f = nac.y + "-" + String(nac.m).padStart(2, "0") + "-" + String(nac.d).padStart(2, "0");
  $("regBtn").disabled = true; e.textContent = "";
  try {
    const nuevo = { tel: t, nombre: mayus(partes[0]), apellido: mayus(partes.slice(1).join(" ")), sellos: 0, total: 0, canjes: 0, ultima: 0 };
    const ok = await DB.create(nuevo, { email: m, nac: f, creado: Date.now() });
    if (ok !== false) { try { await cargarCfg(); const [sf, sg, se] = sumarSello(nuevo); await DB.patch(t, sf); bienvenida = { e: sg ? se : null }; } catch (z) {} } /* sello de bienvenida automático */
    yoSet(t); ["rn", "rt", "rc"].forEach(i => $(i).value = ""); go("tarjeta");
  } catch (x) { e.textContent = "No pudimos guardar tu registro. Inténtalo otra vez." + (x && x.message ? " (código " + x.message + ")" : ""); }
  $("regBtn").disabled = false;
};

/* ---------- Navegación ---------- */
const LEAD = { reservar: "Reserva tu cita en pocos pasos.", registro: "Únete al club y acumula sellos en cada visita.", visita: "Suma tu sello de hoy.", tarjeta: "Tu tarjeta de fidelidad.", productos: "Nuestros productos.", galeria: "Nuestros trabajos." };
let cur = null;
/* La visita (y el sello automático) solo se registra al abrir la página escaneando el QR (#visita).
   Escribir la dirección después, usar el historial o recargar no suma sellos. */
let escaneo = location.hash.slice(1) === "visita";
let verDe = null, curPar = "";
function show(v) {
  const par = v.split("/")[1] || ""; v = v.split("/")[0];
  verDe = v === "tarjeta" && par ? (normTel(par) || par) : null;
  if (!LEAD[v]) v = "reservar";
  if (v === "visita") { if (!escaneo) v = "tarjeta"; else { escaneo = false; try { history.replaceState(null, "", "#tarjeta"); } catch (e) {} } }
  if (v === cur && par === curPar) return; cur = v; curPar = par;
  document.querySelectorAll("[data-v]").forEach(e => e.hidden = e.dataset.v !== v);
  const activo = v === "visita" ? "tarjeta" : v;
  document.querySelectorAll("#nav a").forEach(a => { if (a.dataset.n === activo) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  $("nav").hidden = v === "admin"; $("back").hidden = v === "reservar"; $("lead").textContent = LEAD[v];
  if (v === "visita") vistaVisita(); else if (v === "tarjeta") vistaTarjeta(); else if (v === "registro") initNac(); else if (v === "productos") vistaProductosC(); else if (v === "galeria") vistaGaleria();
  window.scrollTo({ top: 0 });
}
$("back").onclick = () => go("reservar");
function go(v) { try { history.replaceState(null, "", "#" + v); } catch (e) {} show(v); }
document.addEventListener("click", e => {
  const a = e.target.closest('a[href^="#"]'); if (!a) return;
  const v = a.getAttribute("href").slice(1); if (LEAD[v]) { e.preventDefault(); go(v); }
});
window.addEventListener("hashchange", () => show(location.hash.slice(1)));
show(location.hash.slice(1));

/* ---------- Productos ---------- */

    + '<div class="pb"><b>' + esc(p.n) + "</b>" + (p.d ? '<span class="pd">' + esc(p.d) + "</span>" : "") + '<span class="pp">' + fmtSoles(+p.p || 0) + (p.ok === false ? ' <em class="tag">Agotado</em>' : "") + "</span></div></div>").join("") + "</div>" : '<p class="empty">Pronto tendremos productos disponibles.</p>');

/* ---------- Galería de trabajos ---------- */
let galC = { v: -1, items: [] };
function galItem(it) {
  const d = it.desc ? "<figcaption>" + esc(it.desc) + "</figcaption>" : "";
  let m = "";
  if (it.tipo === "yt" && ytId(it.src)) m = '<iframe src="https://www.youtube-nocookie.com/embed/' + ytId(it.src) + '" loading="lazy" allowfullscreen title="' + esc(it.desc || "Video") + '"></iframe>';
  else if (it.tipo === "video" && /^(https:|data:video)/.test(it.src)) m = '<video src="' + esc(it.src) + '" controls playsinline preload="metadata"></video>';
  else if (it.tipo === "img" && /^(https:|data:image)/.test(it.src)) m = '<img src="' + esc(it.src) + '" alt="' + esc(it.desc || "Trabajo realizado") + '" loading="lazy">';
  else return "";
  return '<figure class="gi"><div class="gm">' + m + "</div>" + d + "</figure>";
}
function pintaGal(box) {
  const pos = {}; box.querySelectorAll(".grow").forEach(g => { pos[g.dataset.s] = g.scrollLeft; });
  const sec = cfg.galSec.map(s => ({ s, it: galC.items.filter(x => x.sec === s.id).sort((a, b) => (a.fecha || 0) - (b.fecha || 0)) })).filter(x => x.it.length);
  box.innerHTML = sec.length ? sec.map(x => '<div class="gsec"><h2>' + esc(x.s.n) + "</h2>" + (x.s.d ? '<p class="hint">' + esc(x.s.d) + "</p>" : "") + '<div class="grow" data-s="' + esc(x.s.id) + '">' + x.it.map(galItem).join("") + "</div></div>").join("") : '<p class="empty">Pronto subiremos nuestros mejores trabajos.</p>';
  box.querySelectorAll(".grow").forEach(g => { if (pos[g.dataset.s]) g.scrollLeft = pos[g.dataset.s]; });
}
async function vistaGaleria(silent) {

document.addEventListener("click", e => {

/* ---------- Cambios del administrador en tiempo real ---------- */
let cfgSig = "", svSig = "", enSync = false;
async function sincronizar() {
  if (document.hidden || enSync) return; enSync = true;
  try {
    const n = await DB.cfg(), sig = JSON.stringify(n);
    if (sig !== cfgSig) {
      cfgSig = sig; cfg = n;
      const sv = JSON.stringify(n.servicios);
      if (sv !== svSig) {
        svSig = sv; const sel = (S.svc !== null && SERVICIOS[S.svc]) ? SERVICIOS[S.svc].n : null;
        aplicarServicios();
        if (sel) { const j = SERVICIOS.findIndex(x => x.n === sel); if (j >= 0) document.querySelectorAll("#svtrack .svc")[j].click(); }
      }
      pintaDias();
      if (cur === "galeria") vistaGaleria(true);
      if (cur === "productos") pintaProd($("prodC"));
    }
    const t = yoGet(), box = $("tarBox");
    if (cur === "tarjeta" && t && box.querySelector("#otro")) { const c = await DB.get(t); if (c && firma(c) !== ultimoSig) verTarjeta($("cardT"), box, c); }
  } catch (e) {}
  enSync = false;
}
setInterval(sincronizar, 10000);

window.addEventListener("storage", e => { if (e.key === LK) sincronizar(); });
sincronizar();
/* Pista animada «desliza» en carruseles y pestañas con scroll lateral */
function pistaDesliza(el) {
  el.dataset.swh = "1";
  const w = document.createElement("div"); w.className = "swW"; w.style.margin = getComputedStyle(el).margin; el.style.margin = "0";
  el.parentNode.insertBefore(w, el); w.appendChild(el);
  const h = document.createElement("div"); h.className = "swh off" + (el.id === "nav" ? " nv" : ""); h.setAttribute("aria-hidden", "true");
  h.innerHTML = (el.id === "nav" ? "" : "Desliza") + "<i>›</i><i>›</i><i>›</i>"; w.appendChild(h);
  const up = () => { const ok = el.clientWidth > 0 && el.scrollWidth > el.clientWidth + 8 && el.scrollLeft + el.clientWidth < el.scrollWidth - 8 && (el.id === "nav" || el.scrollLeft < 40); h.classList.toggle("off", !ok); };
  el.addEventListener("scroll", up, { passive: true }); el._swu = up; up(); setTimeout(up, 600);
}
const barrerPistas = () => { document.querySelectorAll(".grow:not([data-swh]), #nav:not([data-swh])").forEach(pistaDesliza); document.querySelectorAll("[data-swh]").forEach(e => e._swu && e._swu()); };
new MutationObserver(barrerPistas).observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ["hidden"] });
window.addEventListener("load", barrerPistas); window.addEventListener("resize", barrerPistas);
